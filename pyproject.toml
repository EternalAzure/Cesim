[project]
name = "cesim"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Miika Kalliokoski", email = "kall.miika@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "multipledispatch>=1.0.0",
    "openpyxl>=3.1.5",
    "pandas[excel]>=3.0.6",
    "pyfiglet>=1.0.4",
    "simple-term-menu>=1.6.6",
    "statsmodels>=0.15.0",
    "tqdm>=4.70.1",
    "xlrd>=2.0.2",
]

[project.scripts]
cesim = "cesim:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
